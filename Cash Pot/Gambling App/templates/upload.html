{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4>Upload CSV Data</h4>
            </div>
            <div class="card-body">
                <div class="alert alert-info">
                    <h6>CSV Format Required:</h6>
                    <p>Your CSV file must have these columns: <code>date, game, name, numbers, event</code></p>
                    <small>Example format:<br>
                    <code>2025-09-14,MIDDAY,"Cash Pot",26,36193</code></small>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="file" class="form-label">Select CSV File:</label>
                        <input class="form-control" type="file" name="file" id="file" accept=".csv" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Upload and Process</button>
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
                </form>

                <hr>

                <h5>Add Single Draw</h5>
                <form method="POST" action="{{ url_for('add_single_draw') }}">
                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-label">Date:</label>
                            <input type="date" class="form-control" name="date" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Game:</label>
                            <select class="form-select" name="game" required>
                                <option value="EARLYBIRD">EARLYBIRD</option>
                                <option value="MORNING">MORNING</option>
                                <option value="MIDDAY">MIDDAY</option>
                                <option value="MIDAFTERNOON">MIDAFTERNOON</option>
                                <option value="DRIVETIME">DRIVETIME</option>
                                <option value="EVENING">EVENING</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-md-6">
                            <label class="form-label">Name:</label>
                            <input type="text" class="form-control" name="name" value="Cash Pot" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Number:</label>
                            <input type="number" class="form-control" name="numbers" min="1" max="36" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Event ID:</label>
                            <input type="text" class="form-control" name="event" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success mt-3">Add Single Draw</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const eventInput = document.querySelector('input[name="event"]');
        const singleDrawForm = document.querySelector('form[action="{{ url_for("add_single_draw") }}"]');

        if (singleDrawForm) {
            singleDrawForm.addEventListener('submit', function(e) {
                // Clean event ID before submission
                if (eventInput.value.trim().startsWith('#')) {
                    eventInput.value = eventInput.value.trim().substring(1);
                }
            });
        }

        // Also clean on input change
        if (eventInput) {
            eventInput.addEventListener('input', function(e) {
                if (this.value.startsWith('#')) {
                    this.value = this.value.substring(1);
                }
            });
        }
    });
</script>
{% endblock %}
