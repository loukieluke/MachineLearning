<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lottery Prediction System</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="{{ url_for('index') }}"> Lottery Predictor</a>
                <div>
                    <a class="nav-link" href="{{ url_for('index') }}">Home</a>
                    <a class="nav-link" href="{{ url_for('upload_csv') }}">Upload CSV</a>
                    <a class="nav-link" href="{{ url_for('history') }}">Draw History</a>
                    <a class="nav-link" href="{{ url_for('prediction_history_page') }}">Predictions vs Actuals</a>
                </div>
            </div>
        </nav>

        <div class="container mt-4">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show flash-auto-dismiss" role="alert" data-bs-autohide="4000">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            {% block content %}{% endblock %}
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            document.querySelectorAll('.flash-auto-dismiss').forEach(function(alertEl) {
                var delay = parseInt(alertEl.getAttribute('data-bs-autohide') || '4000', 10);
                setTimeout(function() {
                    var alert = bootstrap.Alert.getOrCreateInstance(alertEl);
                    alert.close();
                }, delay);
            });
        </script>
        <script src=" {{ url_for('static', filename='script.js') }}"></script>
    </body>
</html>
